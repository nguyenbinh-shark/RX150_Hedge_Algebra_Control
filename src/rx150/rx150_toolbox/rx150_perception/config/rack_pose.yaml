# rack_pose.yaml — VỊ TRÍ GIÁ ĐỠ ỐNG NGHIỆM đo bằng AprilTag.
#
# SINH TỰ ĐỘNG bởi rack_calib_node (mode snap) — ĐỪNG sửa tay: lần snap sau
# ghi đè sạch. Muốn đổi hình học thì sửa config/rack_calib.yaml rồi snap lại.
#
# tube_rack_node ĐỌC THẲNG file này (tham số rack_calib_file) — nó KHÔNG tra
# TF lúc chạy, nên giá xê dịch thì phải snap lại chứ số cũ không tự đúng.
#
# Đo lúc 2026-09-14T13:27:28 · 36 mẫu · tag id 0 · tản mát ≤ 0.6 mm / 0.30°

base_frame: rx150/base_link
rack_frame: tube_rack
measurement:
  tag_id: 0
  samples: 36
  calibrated_at: '2026-09-14T13:27:28'
  spread_mm: [0.06, 0.04, 0.60]
  angle_spread_deg: 0.303
  tf_fallback: 0
geometry:
  mount: top_flat
  rect_long_m: 0.1200
  rect_short_m: 0.0500
  hole_z_offset_m: 0.0000
  yaw_offset_deg: 0.0
  hole_offsets_uvh:   # trong khung GIÁ, theo thứ tự slot 0..N
    - [-0.0600, +0.0000, +0.0000]   # slot 0
    - [+0.0600, +0.0000, +0.0000]   # slot 1
    - [-0.0600, +0.0500, +0.0000]   # slot 2
    - [+0.0600, +0.0500, +0.0000]   # slot 3

# rx150/base_link → tube_rack: gốc ở TAG, +z = trục lỗ,
# +x = dọc cạnh dài, +y = hướng ra cạnh xa.
rack_pose:
  x: 0.309976
  y: 0.097568
  z: 0.085144
  qx: -0.040850884
  qy: -0.022103294
  qz: 0.716419208
  qw: 0.696122236

# Trục lỗ (đơn vị) và độ nghiêng so với phương thẳng đứng. tube_rack_node
# dùng đúng góc này làm pitch của ee lúc cắm (pitch = 0 ⇒ ee_z thẳng đứng).
slot_axis: [-0.089306, 0.025204, 0.995685]
rack_tilt_deg: 5.324
long_edge_yaw_deg: 91.576

# MIỆNG LỖ trong rx150/base_link (m). Chỉ số = chỉ số slot mà
# color_slot_map (tube_rack_params.yaml) đang trỏ tới.
slots:
  - [0.311626, 0.037613, 0.086810]   # slot 0  r=0.314m
  - [0.308327, 0.157522, 0.083479]   # slot 1  r=0.346m
  - [0.261844, 0.036121, 0.082382]   # slot 2  r=0.264m
  - [0.258545, 0.156029, 0.079051]   # slot 3  r=0.302m

# Hộp vật cản THẲNG TRỤC bao 4 lỗ (planning scene). Nóc hộp mặc định nằm ở
# mặt phẳng miệng lỗ để không chắn đường cắm từ trên xuống.
rack_box:
  x: 0.285085
  y: 0.096821
  z: 0.032930
  size_x: 0.073080
  size_y: 0.141401
  size_z: 0.107758
