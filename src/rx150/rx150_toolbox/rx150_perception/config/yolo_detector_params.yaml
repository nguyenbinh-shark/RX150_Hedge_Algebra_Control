# yolo_detector_params.yaml — Tham số độ chính xác của yolo_tube_detector_node.
#
# Dùng:
#   ros2 run rx150_perception yolo_tube_detector_node.py --ros-args \
#       --params-file src/rx150_perception/config/yolo_detector_params.yaml
#
# Quy trình tune khuyến nghị (với camera + ống THẬT):
#   1. Bật log_gate_metrics: true, chạy vài phút, đọc dòng [gate] trong log:
#      mỗi detection in area / tỷ_lệ / điểm nắp / điểm đáy / margin.
#   2. Từ số thật đó mới đặt min_aspect_ratio & cap_score_margin (đừng đoán).
#   3. Nếu ống nhỏ/xa hay bị sót: nâng imgsz lên 800 (nhớ hạ iou xuống ~0.45
#      vì imgsz cao sinh nhiều box trùng hơn).
/**:
  ros__parameters:
    # ---- YOLO ----
    conf_threshold: 0.4       # hạ xuống 0.3 nếu sót ống, nâng 0.5 nếu có detection ma
    imgsz: 0                  # 0 = 640 native (5.8ms). 800 = bắt ống nhỏ tốt hơn (12.9ms)
    iou: 0.7                  # hạ ~0.45 khi imgsz > 640 để gộp box trùng
    max_det: 30
    agnostic_nms: false       # true nếu cùng 1 ống bị ra 2 màu chồng nhau
    retina_masks: true        # mask ở độ phân giải ảnh gốc (nét hơn); tự bật khi imgsz != 0

    # ---- Depth ----
    depth_window: 5           # cửa sổ median (px). 7 nếu depth nhiều lỗ; 3 nếu ống rất mảnh
    depth_min_valid_ratio: 0.30  # <30% pixel hợp lệ trong cửa sổ -> coi như mất depth
    depth_min_m: 0.10
    depth_max_m: 1.50         # thu hẹp về khoảng cách bàn thật (vd 0.9) để loại nền

    # ---- Mask / trục ống ----
    mask_open_kernel: 5       # opening GPU; 3 nếu ống mảnh bị ăn mòn, <3 = tắt
    mask_min_area_px: 100.0
    bbox_pad_px: 4
    endpoint_frac: 0.70       # vị trí lấy 2 cực dọc trục (0.70 = 70% nửa chiều dài)
    min_aspect_ratio: 0.0     # 0 = TẮT. Sau khi xem [gate]: ~1.6 loại mask tròn (yaw rác)

    # ---- Phân biệt nắp/đáy (HSV) ----
    cap_patch_radius: 14      # ~ bán kính nắp trên ảnh (px)
    cap_sat_min: 60           # hạ nếu ánh sáng yếu làm màu nhạt
    cap_val_min: 50
    cap_hue_tol: 12.0
    cap_score_margin: 0.0     # 0 = TẮT. Sau khi xem [gate]: ~20 chặn ca dễ lật yaw 180°
    log_gate_metrics: false   # BẬT KHI TUNE: in số đo từng detection

    # ---- Làm mượt theo thời gian ----
    smooth_alpha: 0.5         # EMA: 0=tắt, 0.8=rất mượt (đo: rung 5mm/4° -> 2.8mm/1.3°)
    smooth_match_dist_m: 0.04 # detection cách track < 4cm thì coi là cùng một ống
    min_hits: 2               # cần thấy 2 frame liên tiếp mới publish (1 = tắt)
    track_timeout_s: 1.0

    # ---- Tần suất ----
    detect_rate_hz: 5.0       # GPU chỉ mất 8.5ms/frame -> có thể nâng 15-30 nếu cần mượt
