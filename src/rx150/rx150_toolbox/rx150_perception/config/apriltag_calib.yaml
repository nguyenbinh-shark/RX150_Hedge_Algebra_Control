# AprilTag config cho hand-eye calibration (rx150_fuzzy_controller).
# Dùng cho node apriltag_ros/apriltag_ros_continuous_detector_node,
# được launch trong handeye_calibrate.launch.py.
#
# QUAN TRỌNG:
#  - Comment trong file param YAML phải là '#'. Trước đây header này dùng '//' nên
#    cả file KHÔNG parse được ("mapping values are not allowed here", dòng 5).
#  - tag_family phải khớp với tag in vật lý (mặc định tag36h11).
#  - standalone tag 'tag_0': frame con do apriltag publish sẽ tên là 'tag_0'
#    (xem common_functions.cpp: child_frame_id = tag name). Đây chính là
#    tracking_marker_frame truyền cho easy_handeye2.
#  - 'size' = chiều dài cạnh tag (m). PHẢI khớp với tag in thật, nếu không
#    pose ước lượng sẽ bị sai scale -> calibration sai.
#  - Nếu in tag khác (id/size/family), sửa phần standalone_tags cho khớp — và sửa
#    LUÔN tags.yaml + ee_tag.yaml, ba file này tả CÙNG một tấm tag trên tay gắp.
# ═══ BẢN ĐỒ ID TAG CỦA HỆ (đổi một chỗ là phải đổi đủ) ═══════════════════
#   id 1  TAG TAY GẮP  — dán ở cổ tay (rx150/ar_tag_link, con của ee_arm_link)
#                        khai trong: tags.yaml, apriltag_calib.yaml, ee_tag.yaml
#   id 0  TAG GIÁ      — dán trên giá đỡ ống nghiệm
#                        khai trong: rack_tag.yaml, rack_calib.yaml (tag_id)
# Hai id KHÁC nhau nên mỗi detector chỉ khai id của mình ⇒ không bao giờ nhìn thấy
# tag của bên kia, dù cả hai cùng nằm trong khung hình. Đây là cách tách ĐÚNG;
# lọc theo TF (ignore_near_frames trong rack_calib.yaml) chỉ là đường dự phòng cho
# trường hợp buộc phải dùng chung một id.
# ════════════════════════════════════════════════════════════════════════
/**:
  ros__parameters:
    # Detector settings
    tag_family: 'tag36h11'      # tagStandard52h13 | tagStandard41h12 | tag36h11 | tag25h9 | tag16h5 | ...
    tag_threads: 2
    tag_decimate: 1.0
    tag_blur: 0.0
    tag_refine_edges: 1
    tag_debug: 0
    max_hamming_dist: 2
    publish_tf: true            # publish TF camera_color_optical_frame -> tag_0
    transport_hint: 'raw'
    # false: ảnh annotated 640x480x30 BGR8 = ~27.6 MB/s và không node/RViz nào subscribe.
    # Bật lại tạm thời khi cần debug bằng mắt xem tag có được nhận không.
    publish_tag_detections_image: false

    # Tag definitions — TAG TAY GẮP: tag36h11 id=1, cạnh ô đen 28mm (0.028m).
    # 'tag_0' là TÊN frame (tracking_marker_frame của easy_handeye2), không phải id.
    # id PHẢI khớp tags.yaml + ee_tag.yaml — cùng một tấm tag vật lý.
    standalone_tags:
      tag_names: ['tag_0']
      tag_0:
        id: 1
        size: 0.028
    # KHÔNG khai 'tag_bundles: {bundle_names: []}': rclcpp không suy được kiểu của
    # list RỖNG -> node chết lúc khởi động ("parameter_value_from failed for
    # parameter 'tag_bundles.bundle_names'"). Vắng param thì node tự declare rỗng.