/**:
  ros__parameters:
    # Bật/tắt hộp giới hạn vùng làm việc
    enable_roi_box: true

    # Giới hạn trục X (mét) — Trước mặt robot (tầm với rx150: 0.10m -> 0.35m)
    roi_x_min: -0.10
    roi_x_max: 0.45

    # Giới hạn trục Y (mét) — Sang 2 bên (âm là bên phải, dương là bên trái)
    roi_y_min: -0.15
    roi_y_max:  0.30

    # Giới hạn trục Z (mét) — Độ cao so với mặt bàn (z=0 là mặt bàn)
    roi_z_min: -0.02
    roi_z_max:  0.25

    # Ngưỡng tin cậy của model YOLO (0.1 -> 1.0)
    conf_threshold: 0.6

